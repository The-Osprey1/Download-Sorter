[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "download-sorter"
dynamic = ["version"]
description = "Local-first automated Downloads and Documents organizer with background daemon, visual rules editor, live sandbox simulator, and 3D/CNC intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Devyn Fidel"}
]
keywords = [
    "downloads",
    "file-organizer",
    "automation",
    "watchdog",
    "pyside6",
    "gcode",
    "3d-printing",
    "bambu",
    "haas"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities"
]
dependencies = [
    "watchdog>=6.0.0",
    "pillow>=12.3.0",
    "PySide6>=6.12.0",
    "defusedxml>=0.7.1",
    "pypdf>=7.1.1"
]

[project.urls]
Homepage = "https://github.com/The-Osprey1/Download-Sorter"
Documentation = "https://github.com/The-Osprey1/Download-Sorter#readme"
Repository = "https://github.com/The-Osprey1/Download-Sorter.git"
Issues = "https://github.com/The-Osprey1/Download-Sorter/issues"
Changelog = "https://github.com/The-Osprey1/Download-Sorter/blob/main/CHANGELOG.md"
Source = "https://github.com/The-Osprey1/Download-Sorter"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
    "pyinstaller>=6.22.3"
]

[project.scripts]
download-sorter = "main:main"

[tool.setuptools]
py-modules = ["about", "main"]
packages = ["download_sorter", "download_sorter.ui"]

[tool.setuptools.package-dir]
download_sorter = "src/download_sorter"

[tool.setuptools.dynamic]
version = {attr = "about.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests_v3"]
# Put the repository root (for `tests_v3.*`, `main`, `about`) and `src` on the path,
# so `pytest tests_v3` works the same as `python -m pytest tests_v3`.
pythonpath = [".", "src"]
python_files = ["test_*.py"]
addopts = "-q"
# A test that runs longer than this many seconds is stuck: the run is stopped and
# shows where. Needs pytest-timeout (installed with pip install -e .[dev]).
timeout = 300
timeout_method = "thread"
markers = [
    "desktop: needs a live interactive Windows desktop (real dialogs/windows); deselect with -m \"not desktop\"",
    "ntfs: needs a real NTFS volume (hardlinks, file indexes, cloud attributes)",
    "shipped_defaults: use the rule packs a new install really starts with (other tests get the School, Career and 3D printing packs they were written for)",
]

[tool.ruff]
target-version = "py310"
src = [".", "src"]

[tool.ruff.lint]
# Mistakes that break or hide bugs: syntax errors, undefined names, unused imports
# and variables, names defined twice. Style is not checked.
select = ["E9", "F"]
