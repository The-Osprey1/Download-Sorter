[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "download-sorter"
dynamic = ["version"]
description = "Local-first automated Downloads and Documents organizer with background daemon, visual rules editor, live sandbox simulator, and 3D/CNC intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Devyn Fidel"}
]
keywords = [
    "downloads",
    "file-organizer",
    "automation",
    "watchdog",
    "pyside6",
    "gcode",
    "3d-printing",
    "bambu",
    "haas"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities"
]
dependencies = [
    "watchdog>=6.0.0",
    "pillow>=12.0.0",
    "PySide6>=6.12.0",
    "defusedxml>=0.7.1",
    "pypdf>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/The-Osprey1/Download-Sorter"
Documentation = "https://github.com/The-Osprey1/Download-Sorter#readme"
Repository = "https://github.com/The-Osprey1/Download-Sorter.git"
Issues = "https://github.com/The-Osprey1/Download-Sorter/issues"
Changelog = "https://github.com/The-Osprey1/Download-Sorter/blob/main/CHANGELOG.md"
Source = "https://github.com/The-Osprey1/Download-Sorter"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.3.1",
    "pyinstaller>=6.0.0"
]

[project.scripts]
download-sorter = "main:main"
download-sorter-app = "main:main"
download-sorter-run = "sort_once:main"
download-sorter-watch = "watch:main"
download-sorter-tray = "tray:main"
download-sorter-gui = "rules_manager:main"
download-sorter-undo = "sort_undo:main"
gcode-peek = "gcode_peek:main"
unzip-3d = "unzip_3d:main"
unzip-archive = "unzip_archive:main"
download-sorter-remodel = "remodel:main"

[tool.setuptools]
py-modules = [
    "about",
    "batch_handoff",
    "clean_old",
    "config_manager",
    "gcode_peek",
    "hold_manager",
    "learning",
    "folder_scan",
    "onboarding",
    "main",
    "problem_report",
    "project_scan",
    "projects_hub",
    "projects_page",
    "tray_qt",
    "quick_switcher",
    "refile",
    "remodel",
    "ribbon_popup",
    "rules_manager",
    "safe_ops",
    "sort_once",
    "sort_undo",
    "sorter",
    "status",
    "suite_theme",
    "toggle_pause",
    "tray",
    "ui_icons",
    "ui_motion",
    "ui_style",
    "ui_categories",
    "ui_widgets",
    "quit_signal",
    "update_check",
    "updater",
    "unzip_3d",
    "unzip_archive",
    "watch",
    "bambu_recent",
    "kits",
    "zip_members",
    "desktop_sweep",
    "hotkey",
    "pdf_content",
    "photo_kind",
    "prints",
    "rule_check",
    "setup_export",
    "shelf",
    "space_report",
    "consolidate",
    "installer_builder",
]

[tool.setuptools.dynamic]
version = {attr = "about.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
addopts = "-q"
# A test that runs longer than this many seconds is stuck: the run is stopped and
# shows where. Needs pytest-timeout (installed with pip install -e .[dev]).
timeout = 300
timeout_method = "thread"
markers = [
    "desktop: needs a live interactive Windows desktop (real dialogs/windows); deselect with -m \"not desktop\"",
    "ntfs: needs a real NTFS volume (hardlinks, file indexes, cloud attributes)",
]
