name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    # Catches mistakes the tests can miss: a misspelled name in code no test
    # reaches, an import left behind, a variable that is set but never used.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Check the code
      run: |
        python -m pip install ruff==0.17.6
        ruff check .

  test:
    runs-on: windows-latest
    # A normal run takes about 3 minutes. Without a limit, one stuck test kept a
    # job running until GitHub's 6-hour maximum cancelled it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout

    - name: Run test suite
      run: |
        pytest tests_v3 -v
