name: Release Standalone Windows Package

on:
  push:
    tags:
      - 'v*'
  # Build (without publishing) on pull requests that change how the release is
  # made, so a broken installer build shows up before a tag is pushed.
  pull_request:
    branches: [ main ]
    paths:
      - 'build_release.py'
      - 'installer_builder.py'
      - 'installer.iss'
      - 'DownloadSorter.spec'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'about.py'
      - 'release_notes.py'
      - 'version_resource.py'
      - 'suite_theme.py'
      - 'main.py'
      - 'CHANGELOG.md'
      - 'src/**'
      - 'tests_v3/**'
      - 'verify_release.py'
      - 'pe_signing.py'
      - 'packaging/**'
      - 'uninstall.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows x64 Standalone
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Code signing runs only once these repository variables exist (issue #9, packaging/SIGNING.md).
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

    steps:
      # Without the SignPath settings every signing step below is skipped and the release is
      # unsigned, which Smart App Control blocks. Say so where it can't be missed.
      - name: Warn that this build will not be code-signed
        if: env.SIGNPATH_ORGANIZATION_ID == ''
        shell: pwsh
        run: |
          $msg = "SignPath is not set up (repository variable SIGNPATH_ORGANIZATION_ID is empty), so this build is NOT code-signed. Windows Smart App Control will block it. See packaging/SIGNING.md."
          Write-Output "::warning title=Release is not code-signed::$msg"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## :warning: Not code-signed`n`n$msg"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest pytest-timeout

      # A bootloader compiled on this runner, not the prebuilt one shipped in the PyInstaller
      # wheel that many antivirus heuristics have learned to flag (issue #9).
      - name: Build PyInstaller's bootloader from source
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip uninstall -y PyInstaller
          python -m pip cache remove PyInstaller
          python -m pip install --verbose --no-binary=PyInstaller PyInstaller

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import about; print(about.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match the app version v$version"
            exit 1
          }

      - name: Run Test Suite
        run: |
          python -m pytest tests_v3 -v

      # Unsigned build (when SIGNPATH_ORGANIZATION_ID is not configured): identical to single-stage build.
      - name: Build Standalone Executable & Package
        if: env.SIGNPATH_ORGANIZATION_ID == ''
        run: |
          python build_release.py

      # Signed build (two-stage): build app folder -> sign owned binaries/scripts -> package ZIP/setup -> sign setup.
      - name: Build app stage
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          python build_release.py --stage app

      - name: List embedded Authenticode signers in dist/DownloadSorter
        run: |
          python pe_signing.py list --json

      - name: Stage owned unsigned executables and scripts
        id: stage_unsigned
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          python pe_signing.py stage dist/DownloadSorter dist/unsigned-app --github-output

      - name: Keep unsigned app files for signing
        id: unsigned_app
        if: env.SIGNPATH_ORGANIZATION_ID != '' && steps.stage_unsigned.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: DownloadSorter-app-unsigned
          path: dist/unsigned-app/
          if-no-files-found: error

      - name: Sign app executables, libraries, and scripts with SignPath
        if: env.SIGNPATH_ORGANIZATION_ID != '' && steps.stage_unsigned.outputs.count != '0'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_APP_SIGNING_POLICY_SLUG || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-app

      - name: Put signed files back into dist/DownloadSorter
        if: env.SIGNPATH_ORGANIZATION_ID != '' && steps.stage_unsigned.outputs.count != '0'
        run: |
          python pe_signing.py restore dist/signed-app dist/DownloadSorter

      - name: Package ZIP, setup file, and checksums
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          python build_release.py --stage package

      - name: Keep the unsigned setup file for signing
        id: unsigned
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: DownloadSorter-setup-unsigned
          path: dist/DownloadSorter-Setup-v*-windows-x64.exe
          if-no-files-found: error

      - name: Sign the setup file with SignPath
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Use the signed setup file and refresh checksums
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item dist/signed/DownloadSorter-Setup-v*-windows-x64.exe dist/ -Force
          python -c "import build_release; build_release.write_checksums()"

      # Same gate as a local release: versions agree, every CLI flag exists, the
      # checksums match the files, and both built programs start. The tests ran above.
      - name: Release preflight
        if: env.SIGNPATH_ORGANIZATION_ID == ''
        run: |
          python verify_release.py --skip-tests

      - name: Release preflight (require signed)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          python verify_release.py --skip-tests --require-signed

      - name: Check that an update replaces a running copy and opens it again
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Wait for the installer itself only. "Start-Process -Wait" also waits
          # for every program the installer starts, and with /UPDATE it reopens
          # Download Sorter, which keeps running, so -Wait never returned.
          function Wait-Installer($proc) {
            $null = $proc.Handle  # without this, ExitCode can come back empty
            if (-not $proc.WaitForExit(180000)) { throw "The installer did not finish within 3 minutes" }
            $proc.WaitForExit()  # let .NET collect the exit code
            return $proc.ExitCode
          }

          $setup = Get-ChildItem dist -Filter "DownloadSorter-Setup-v*-windows-x64.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "ds-update-check"
          $exe = Join-Path $dir "DownloadSorter.exe"

          # 1. A normal silent install.
          $p = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -PassThru
          $code = Wait-Installer $p
          if ($code -ne 0) { throw "First install failed with exit code $code" }
          if (-not (Test-Path $exe)) { throw "DownloadSorter.exe is missing after the first install" }

          # 2. Start the app from that folder, so its files are in use.
          $running = Start-Process $exe -ArgumentList "--home" -PassThru
          Start-Sleep -Seconds 10
          if ($running.HasExited) { throw "The installed app did not stay open (exit code $($running.ExitCode))" }
          $before = (Get-Item $exe).LastWriteTimeUtc
          Start-Sleep -Seconds 2

          # 3. Update over it, the way the app's own updater does.
          $p = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir", "/UPDATE" -PassThru
          $code = Wait-Installer $p
          if ($code -ne 0) { throw "Update install failed with exit code $code" }

          # 4. The running copy was closed and its files replaced.
          if (-not $running.HasExited) { throw "The installer did not close the running app" }
          $after = (Get-Item $exe).LastWriteTimeUtc
          if ($after -le $before) { throw "DownloadSorter.exe was not replaced" }

          # 5. The app was opened again.
          Start-Sleep -Seconds 10
          $again = @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [System.StringComparison]::OrdinalIgnoreCase) })
          if ($again.Count -eq 0) { throw "The app was not opened again after the update" }
          Write-Host "Update check passed: running copy closed, files replaced, app reopened ($($again.Count) process(es))."

          # Clean up.
          & $exe --quit
          Start-Sleep -Seconds 5
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [System.StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue

      # The notes warn that the version is unsigned unless signing ran in this build.
      - name: Write the release notes from the changelog
        shell: pwsh
        run: |
          $notesArgs = @("--output", "dist/release_notes.md")
          if ($env:SIGNPATH_ORGANIZATION_ID) { $notesArgs += "--signed" }
          python release_notes.py @notesArgs

      - name: Keep the built files
        uses: actions/upload-artifact@v7
        with:
          name: DownloadSorter-windows-x64
          path: |
            dist/DownloadSorter-Setup-v*-windows-x64.exe
            dist/DownloadSorter-v*-windows-x64.zip
            dist/checksums.txt
            dist/release_notes.md
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DownloadSorter-Setup-v*-windows-x64.exe
            dist/DownloadSorter-v*-windows-x64.zip
            dist/checksums.txt
          body_path: dist/release_notes.md
          draft: false
          # Set the repository variable RELEASE_AS_PRERELEASE to "true" to publish without
          # becoming "Latest": installed copies only update themselves from the latest
          # full release, so a pre-release reaches nobody until it is promoted.
          prerelease: ${{ vars.RELEASE_AS_PRERELEASE == 'true' }}
