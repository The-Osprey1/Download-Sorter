name: Release Standalone Windows Package

on:
  push:
    tags:
      - 'v*'
  # Build (without publishing) on pull requests that change how the release is
  # made, so a broken installer build shows up before a tag is pushed.
  pull_request:
    branches: [ main ]
    paths:
      - 'build_release.py'
      - 'installer_builder.py'
      - 'installer.iss'
      - 'DownloadSorter.spec'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'about.py'
      - 'release_notes.py'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows x64 Standalone
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import about; print(about.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match the app version v$version"
            exit 1
          }

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Build Standalone Executable & Package
        run: |
          python build_release.py

      - name: Write the release notes from the changelog
        run: |
          python release_notes.py --output dist/release_notes.md

      - name: Keep the built files
        uses: actions/upload-artifact@v4
        with:
          name: DownloadSorter-windows-x64
          path: |
            dist/DownloadSorter-Setup-v*-windows-x64.exe
            dist/DownloadSorter-v*-windows-x64.zip
            dist/checksums.txt
            dist/release_notes.md
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DownloadSorter-Setup-v*-windows-x64.exe
            dist/DownloadSorter-v*-windows-x64.zip
            dist/checksums.txt
          body_path: dist/release_notes.md
          draft: false
          prerelease: false
