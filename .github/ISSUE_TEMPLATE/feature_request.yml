name: ✨ Feature Request
description: Suggest an idea or enhancement for Download Sorter
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Download Sorter better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: Is your feature request related to a specific problem or workflow limitation?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Have you considered any alternative workarounds or solutions?
